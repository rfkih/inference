name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false  # never cancel master builds — a half-pushed image is worse than a slow queue

# Least-privilege at the workflow level. Individual jobs cannot escalate beyond this.
# - contents: write    — the deploy job pushes the deploy/prod/<sha> tag.
# - packages: write    — pushes the container image to ghcr.io/<owner>/blackheart-inference.
# - deployments: write — populates the Deployments tab in the production-vps environment.
permissions:
  contents: write
  packages: write
  deployments: write

# Image-registry conventions. The owner part is lowercased from
# github.repository_owner so ghcr.io accepts it (GHCR rejects mixed case).
# The image name is hardcoded to blackheart-inference because this repo is
# named `inference` but the VPS compose expects ghcr.io/<owner>/blackheart-inference.
env:
  REGISTRY: ghcr.io
  IMAGE_INFERENCE: ${{ github.repository_owner }}/blackheart-inference

jobs:
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      # Actions are pinned to commit SHAs (supply-chain hardening). Update the SHA
      # AND the trailing `# vX.Y.Z` comment together; never trust a moving major tag.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (with dev extras)
        # The package + its test deps (pytest, pytest-asyncio, respx) come from
        # the [project.optional-dependencies] dev group in pyproject.toml.
        run: pip install ".[dev]"

      - name: Run tests
        # asyncio_mode=auto and testpaths=tests are configured in pyproject.toml.
        run: pytest -q

  build-image:
    name: Build + push GHCR image
    needs: test
    # Only build/push images on master pushes or manual dispatch. PR builds run
    # tests (above) but skip the image push — PRs aren't deployable.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      # Surface the image tag to the deploy job so it doesn't have to recompute
      # it. Pinned to the run's commit SHA — that's what ends up in
      # /home/starsky/blackheart/.env on the VPS as INFERENCE_TAG.
      sha_tag: ${{ steps.tag.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Compute tag (short SHA)
        id: tag
        run: echo "sha_tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db # v3.6.1

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push inference image
        # The Dockerfile is self-contained (COPY src + pip install .); no build
        # args needed. Two tags pushed: the immutable SHA tag (what the VPS pins
        # to) and `latest` (operator escape hatch — never used by CI deploys).
        uses: docker/build-push-action@5cd11c3a4ced054e52742c5fd54dca954e0edd85 # v6.7.0
        with:
          context: .
          file: ./Dockerfile
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_INFERENCE }}:${{ steps.tag.outputs.sha_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_INFERENCE }}:latest
          push: true
          cache-from: type=gha,scope=inference
          cache-to: type=gha,scope=inference,mode=max

  deploy-inference:
    name: Deploy inference to VPS (docker)
    needs: build-image
    # Safe by default: stays skipped until the repo sets the DEPLOY_ENABLED
    # variable to 'true' (plus the VPS_* secrets/vars + production-vps env).
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production-vps
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: ${{ vars.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # VPS_HOST is a variable (not a secret) since the IP is public anyway
          # and the gh CLI on Windows truncates the last byte of secret values,
          # which manifests as "getaddrinfo *** : Name or service not known".
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          echo "SSH_HOST=${SSH_HOST}" >> "$GITHUB_ENV"
          SSH_USER=$(printf '%s' "${{ vars.VPS_USER }}" | tr -d '[:space:]')
          echo "SSH_USER=${SSH_USER}" >> "$GITHUB_ENV"

      - name: Capture rollback tag
        # docker inspect reads the currently-running container's image. Image ref
        # shape: `ghcr.io/<owner>/blackheart-inference:<sha>`. Split off the tag
        # suffix and stash it. NONE = no prior deploy (first-ever run) → rollback
        # is skipped.
        run: |
          PREV=$(ssh -i ~/.ssh/id_ed25519 "${SSH_USER}@${SSH_HOST}" "docker inspect blackheart-inference --format '{{.Config.Image}}' 2>/dev/null | awk -F: '{print \$NF}' || echo NONE")
          echo "PREV_TAG=${PREV:-NONE}" >> "$GITHUB_ENV"
          echo "Previous inference tag: ${PREV}"

      - name: Pin new tag in /home/starsky/blackheart/.env
        # The compose file resolves the image as
        # ${INFERENCE_IMAGE:-ghcr.io/rfkih/blackheart-inference:${INFERENCE_TAG:-latest}}.
        # A pinned INFERENCE_IMAGE (digest) would override INFERENCE_TAG, so we
        # strip any INFERENCE_IMAGE line and pin INFERENCE_TAG to the SHA we just
        # built — CI SHA-pinning replaces any manual digest pin. `grep -v` + `>>`
        # is the atomic-enough replace that avoids sed -i portability issues.
        env:
          NEW_TAG: ${{ needs.build-image.outputs.sha_tag }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "${SSH_USER}@${SSH_HOST}" \
            "set -e && touch /home/starsky/blackheart/.env && grep -vE '^(INFERENCE_TAG|INFERENCE_IMAGE)=' /home/starsky/blackheart/.env > /tmp/.env.inf || true && echo 'INFERENCE_TAG=${NEW_TAG}' >> /tmp/.env.inf && mv /tmp/.env.inf /home/starsky/blackheart/.env"
          echo "NEW_TAG=${NEW_TAG}" >> "$GITHUB_ENV"

      - name: Pull + recreate inference container
        # The consolidated compose file (with the inference service) is synced to
        # the VPS by the trading repo's deploy. This job only re-pins the tag and
        # recreates the inference container; other services keep running.
        run: |
          ssh -i ~/.ssh/id_ed25519 "${SSH_USER}@${SSH_HOST}" \
            "cd /home/starsky/blackheart && docker compose pull inference && docker compose up -d inference"

      - name: Inference healthcheck (with rollback on failure)
        # 12 attempts × 10s = 120s. /readyz probes the DB pool, so it only returns
        # 200 once the sidecar is actually serving — the readiness analog of the
        # JVM /actuator/health/readiness gate. On failure: re-pin PREV_TAG and
        # bring the container back up so inference is never left broken.
        run: |
          set +e
          ssh -i ~/.ssh/id_ed25519 "${SSH_USER}@${SSH_HOST}" \
            'for i in $(seq 1 12); do curl -fsS http://127.0.0.1:8000/readyz >/dev/null && exit 0; sleep 10; done; exit 1'
          HEALTH=$?
          set -e
          if [ "$HEALTH" -ne 0 ]; then
            echo "::error::Inference healthcheck failed. Rolling back to ${PREV_TAG}."
            if [ "${PREV_TAG}" != "NONE" ]; then
              ssh -i ~/.ssh/id_ed25519 "${SSH_USER}@${SSH_HOST}" \
                "set -e && grep -v '^INFERENCE_TAG=' /home/starsky/blackheart/.env > /tmp/.env.rollback && echo 'INFERENCE_TAG=${PREV_TAG}' >> /tmp/.env.rollback && mv /tmp/.env.rollback /home/starsky/blackheart/.env && cd /home/starsky/blackheart && docker compose up -d inference"
            fi
            exit 1
          fi
          echo "Inference deploy ${NEW_TAG} healthy."

      - name: Prune stale Docker images
        # Remove images not referenced by any running container so per-commit
        # image accumulation doesn't fill the VPS disk. Safe here: rollback (if
        # any) already completed, so the previous SHA is no longer needed.
        if: success()
        run: |
          ssh -i ~/.ssh/id_ed25519 "${SSH_USER}@${SSH_HOST}" \
            "docker image prune -af 2>&1 | tail -1"

      - name: Tag successful production deploy
        # Lightweight git tag — searchable, no release-notes overhead. Format:
        # deploy/prod/<8-char-sha>. Reuse: `git fetch --tags && git checkout deploy/prod/<sha>`.
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="deploy/prod/${GITHUB_SHA::8}"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${TAG}" \
            -f "sha=${GITHUB_SHA}" \
            > /dev/null && echo "Tagged ${TAG}" || echo "::warning::Tag ${TAG} may already exist (non-fatal)"
